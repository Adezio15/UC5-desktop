<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sistema de Login</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .tela {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    width: 300px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  button {
    padding: 10px;
    border: none;
    background: #007bff;
    color: white;
    cursor: pointer;
    border-radius: 5px;
  }

  button:hover {
    background: #0056b3;
  }
</style>
</head>

<body>
  <div class="tela">
    <h2>Login</h2>

    <input type="text" id="loginUsuario" placeholder="Login" />
    <input type="password" id="senhaUsuario" placeholder="Senha" />

    <button id="btnEntrar">Entrar</button>

    <button onclick="ircadastro()">Criar Cadastro</button>
  </div>

  <script>
    function ircadastro() {
      window.location.href = "cadastro.html";
    }
  </script>
<script src="login.js"></script>
</body>
</html>
