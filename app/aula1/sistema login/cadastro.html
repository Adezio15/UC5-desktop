<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cadastro</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  .tela {
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    width: 300px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
</style>
</head>

<body>
  <div class="tela">
    <h2>Cadastro</h2>

    <input type="text" id="cad-nome" placeholder="Nome" />
    <input type="date" id="cad-data" />
    <input type="email" id="cad-email" placeholder="Email" />
    <input type="text" id="cad-login" placeholder="Login" />
    <input type="password" id="cad-senha" placeholder="Senha" />

    <button id="btnSalvar">Salvar</button>
    <button onclick="voltarLogin()">Voltar</button>
  </div>

  <script>
    function voltarLogin() {
      window.location.href = "index.html";
    }
  </script>

  <script src="renderer.js"></script>
</body>
</html>
