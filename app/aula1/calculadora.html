<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            color: black;
            text-align: center;
            transition: background-color 0.3s, color 0.3s;
        }

        body.escuro {
            background-color: #121212;
            color: white;
        }

        button {
            margin: 5px;
            padding: 10px 15px;
            font-size: 18px;
            cursor: pointer;
        }

        input {
            font-size: 20px;
            width: 200px;
            text-align: right;
        }
    </style>
</head>

<body>
    <h1>Calculadora</h1>

    <input type="text" id="visor" readonly><br><br>

    <button id="limpar">Limpar</button>
    <button id="l1">←</button>
    <button class="op">%</button>
    <button id="historico">Histórico</button>
    <button id="tema">Tema</button>

    <div>
        <button class="op">÷</button>
        <button class="num">7</button>
        <button class="num">8</button>
        <button class="num">9</button>
    </div>

    <div>
        <button class="op">*</button>
        <button class="num">4</button>
        <button class="num">5</button>
        <button class="num">6</button>
    </div>

    <div>
        <button class="op">-</button>
        <button class="num">1</button>
        <button class="num">2</button>
        <button class="num">3</button>
    </div>

    <div>
        <button class="op">+</button>
        <button class="num">0</button>
        <button id="igual">=</button>
    </div>

    <script>
        const visor = document.getElementById('visor');
        const limpar = document.getElementById('limpar');
        const botaoTema = document.getElementById('tema');
        const botaoHistorico = document.getElementById('historico');
        let op;
        let historico = [];

        limpar.addEventListener('click', () => {
            visor.value = "";
        });

        // Alternar tema
        botaoTema.addEventListener('click', () => {
            document.body.classList.toggle('escuro'); //adicionar ou remover uma classe
        });

        // Mostrar histórico em nova janela
        botaoHistorico.addEventListener('click', () => {
            let novaJanela = window.open("", "Histórico", "width=400,height=400"); //abrir uma nova janela ou aba do navegador
            novaJanela.document.write("<h2>Histórico de Operações</h2>"); //escrever conteudo dentro de uma nova janela ou aba do navegador.
            if (historico.length === 0) { //mostrar quantos elementos existem dentro da variável
                novaJanela.document.write("<p>Nenhuma operação realizada ainda.</p>"); //escrever dentro de uma nova janela
            } else {
                novaJanela.document.write("<ul>");
                historico.forEach(item => {
                    novaJanela.document.write(`<li>${item}</li>`);
                });
                novaJanela.document.write("</ul>");
            }
        });

        let botoes = document.querySelectorAll('button');
        botoes.forEach((botao) => {
            botao.addEventListener('click', () => {
                if (botao.className === 'num') {
                    visor.value += botao.textContent.trim();
                } else if (botao.id === 'l1') {
                    visor.value = visor.value.slice(0, -1);
                } else if (botao.className === 'op') {
                    visor.value += botao.textContent.trim();
                    op = botao.textContent.trim();
                } else if (botao.id === 'igual') {
                    let conteudo = visor.value.split(op);
                    let resultado;

                    switch (op) {
                        case '+':
                            resultado = Number(conteudo[0]) + Number(conteudo[1]);
                            break;
                        case '-':
                            resultado = Number(conteudo[0]) - Number(conteudo[1]);
                            break;
                        case '*':
                            resultado = Number(conteudo[0]) * Number(conteudo[1]);
                            break;
                        case '÷':
                            resultado = Number(conteudo[0]) / Number(conteudo[1]);
                            break;
                        case '%':
                            resultado = Number(conteudo[0]) % Number(conteudo[1]);
                            break;
                        default:
                            resultado = visor.value;
                    }

                    historico.push(`${visor.value} = ${resultado}`);
                    visor.value = resultado;
                }
            });
        });
    </script>
</body>

</html>

    </script>
</body>

</html>
